# Gitea CI, on the self-hosted macOS runners. The GitHub workflow in .github/workflows/ci.yml runs
# the same gates on GitHub's Linux runners; this one runs them on Apple silicon, where the app is
# actually used. Keep the two in step: a gate added to one belongs in the other.
#
# Gitea reads .gitea/workflows/ in preference to .github/workflows/, so the GitHub packaging and
# release workflows -- which sign and notarise with secrets that live only on GitHub -- never run
# here.
#
# Host mode: these steps run directly on the runner machine, not in a VM. Nothing is installed into
# any Python the host uses: pre-commit goes into a throwaway virtual environment under RUNNER_TEMP.
#
# Homebrew first, always: every step runs under Homebrew's bash, the job puts Homebrew at the front
# of PATH, and .gitea/scripts/toolchain_guard.sh fails the job if what macOS ships (bash 3.2,
# Python 3.9, Apple git) is what it actually got, or if node differs from .nvmrc.
#
# Not here yet: the end-to-end suite. It needs the Electron binary, which `npm ci --ignore-scripts`
# deliberately does not download (the allowScripts decision is open), and the macOS runners have no
# window-server session for an Electron window to open in.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
jobs:
  gates:
    # Pinned to the Mac Studio, whose runner is a separate `gitearunner` account. `macos-arm64` alone
    # also matches the M1 Max, whose runner is the account every Kindled session there shares, and
    # the build and test steps execute this repository's dependency tree as whichever user runs them.
    # stuart-m3ultra-canary is the only label that runner alone carries.
    runs-on: stuart-m3ultra-canary
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: toolchain guard (Homebrew first, current versions)
        run: bash .gitea/scripts/toolchain_guard.sh .nvmrc
      - run: npm ci --ignore-scripts
      - name: pre-commit, in a throwaway virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/precommit"
          "$RUNNER_TEMP/precommit/bin/pip" install --quiet 'pre-commit==4.6.2'
          "$RUNNER_TEMP/precommit/bin/pre-commit" run --all-files --show-diff-on-failure
      # The jest setup file refuses to run until both bundles exist; see .github/workflows/ci.yml.
      - run: npm run build
      - run: npm test -- --coverage
