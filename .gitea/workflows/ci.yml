# Gitea CI, on the self-hosted macOS runners. The GitHub workflow in .github/workflows/ci.yml runs
# the same gates on GitHub's Linux runners; this one runs them on Apple silicon, where the app is
# actually used. Keep the two in step: a gate added to one belongs in the other.
#
# Gitea reads .gitea/workflows/ in preference to .github/workflows/, so the GitHub packaging and
# release workflows -- which sign and notarise with secrets that live only on GitHub -- never run
# here.
#
# Host mode: these steps run directly on the runner machine, not in a VM. Nothing is installed into
# any Python the host uses: pre-commit is the host's Homebrew install, checked by the toolchain guard,
# and its hook environments stay in its cache between jobs instead of being rebuilt on each one.
#
# Homebrew first, always: every step runs under Homebrew's bash, the job puts Homebrew at the front
# of PATH, and .gitea/scripts/toolchain_guard.sh fails the job if what macOS ships (bash 3.2,
# Python 3.9, Apple git) is what it actually got, or if node differs from .nvmrc. Node is Homebrew's too,
# not setup-node's: this runner gives every job a fresh, empty tool cache, so setup-node downloaded
# Node on every job.
#
# Not here yet: the end-to-end suite. It needs the Electron binary, which `npm ci --ignore-scripts`
# deliberately does not download (the allowScripts decision is open), and the macOS runners have no
# window-server session for an Electron window to open in.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # A PR's runs share its ref; each push to main gets its own group, so a newer one cannot cancel it even while pending.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Cancel a superseded run on a PR only: every push to main keeps its own verdict (midst-infra #102).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
jobs:
  gates:
    # Pinned to the Mac Studio, whose runner is a separate `gitearunner` account. `macos-arm64` alone
    # also matches the M1 Max, whose runner is the account every Kindled session there shares, and
    # the build and test steps execute this repository's dependency tree as whichever user runs them.
    # stuart-m3ultra-canary is the only label that runner alone carries.
    runs-on: stuart-m3ultra-canary
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain guard (Homebrew first, current versions)
        run: bash .gitea/scripts/toolchain_guard.sh .nvmrc
      - run: npm ci --ignore-scripts
      # Homebrew's pre-commit (the guard above failed the job if it is missing or not Homebrew's). A fresh
      # virtual environment and a pip install on every job cost about 8 s, and an empty hook cache about 9 s
      # more, before any check ran. Whether the cache was already there is printed, so the log shows it.
      - name: pre-commit (the host's Homebrew install)
        run: |
          cache="${PRE_COMMIT_HOME:-${XDG_CACHE_HOME:-$HOME/.cache}/pre-commit}"
          if [ -d "$cache" ]; then echo "pre-commit cache: present at $cache"; else echo "pre-commit cache: none yet at $cache"; fi
          pre-commit run --all-files --show-diff-on-failure
      - name: vendored midst-format matches its VENDOR.md hashes
        run: node tools/check-vendored-format.mjs
      # The message catalog (midst-infra docs/design/message-catalog.md). Enforced: the catalog matches the
      # code, it is consistent, and the main process writes no words of its own. Report only: words still
      # written into the renderer, until its migration makes that enforcing too.
      - name: message catalog
        run: npm run catalog:check
      - name: message catalog, renderer (report only)
        run: npm run catalog:report
      # Rebuilds the tag VENDOR.md names and byte-compares it with vendor/midst-format/, so the hashes are not
      # the only check: they can be edited in the same commit as the files. midst-format is public on Gitea, so
      # the clone needs no key (the "private" premise was wrong; checked anonymously 19 Oct).
      - name: vendored midst-format equals a rebuild of its tag
        run: |
          git clone --quiet http://gitea-server:3000/The_Kindled/midst-format.git "$RUNNER_TEMP/midst-format"
          MIDST_FORMAT_ROOT="$RUNNER_TEMP/midst-format" node tools/check-vendored-format.mjs --rebuild
      # The jest setup file refuses to run until both bundles exist; see .github/workflows/ci.yml.
      - run: npm run build
      - run: npm test -- --coverage
