# Run locally on every commit, and in CI by the SAME command:
#     pre-commit run --all-files --show-diff-on-failure
# One config, two callers, so local and CI gates cannot drift apart.
#
# Install once per clone:  pre-commit install (npm ci runs it: tools/install-hooks.cjs)
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The checks run on commit, and in CI by `pre-commit run`. Only the hooks below that name another stage run there:
# the closing-keyword check on the commit message, the force-push refusal on push.
default_stages: [pre-commit, manual]
# The vendored build is byte-exact (vendor/midst-format/VENDOR.md): no whitespace fixer, line-ending fixer or
# formatter may touch it, so each of those hooks excludes it. The vendored-format hook below guards it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^vendor/midst-format/
      - id: end-of-file-fixer
        exclude: ^vendor/midst-format/
      - id: check-merge-conflict
      - id: check-case-conflict # macOS/Linux collisions; this repo has accented filenames
      - id: check-json
        # tsconfig files are JSONC BY DESIGN -- TypeScript supports comments, and
        # tsconfig.eslint.json carries the explanation of why it has to exist at all.
        # check-json is a STRICT JSON decoder, so it rejects the file for being what it is
        # meant to be. No coverage is lost: eslint loads that config on every run and fails
        # loudly if it is malformed, which is a stronger check than this one.
        exclude: ^tsconfig\.eslint\.json$|^vendor/midst-format/
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^vendor/midst-format/
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048]

  # ---- local guards. These enforce policy mechanically rather than by discipline. ----
  - repo: local
    hooks:
      - id: forbid-poem-data
        name: poem data must never be committed
        language: fail
        entry: >-
          Poem timelapses are the poets' work and must not enter git. A public push cannot be
          withdrawn. Keep real poems outside this repository; tests write synthetic ones. See
          "Never commit poem content" in CONTRIBUTING.md.
        files: '(\.midst$|\.midst\.zip$)'

      - id: forbid-logs
        name: logs must never be committed
        language: fail
        entry: >-
          Log files carry absolute paths, usernames and environment details. yarn-error.log in the
          fork point contained a contributor's home directory and full shell PATH.
        files: '(\.log$|(^|/)logs/)'

      - id: vendored-format
        name: vendor/midst-format matches the SHA-256 block in its VENDOR.md
        language: system
        entry: node tools/check-vendored-format.mjs
        pass_filenames: false
        files: '^vendor/midst-format/|^tools/check-vendored-format\.mjs$'

      - id: version-consistent
        name: one app version (release/app/package.json is what installers carry)
        language: system
        entry: tools/check_version.sh
        pass_filenames: false
        files: '(^|/)package(-lock)?\.json$|^tools/(check|set)_version\.sh$'
      - id: prettier
        name: prettier (repo's own pinned version)
        language: system
        entry: npx --no-install prettier --write
        files: '\.(ts|tsx|js|jsx|json|css|scss|md|ya?ml)$'
        exclude: '(package-lock\.json|yarn\.lock)$|^vendor/midst-format/'
      - id: catalog-compile
        name: compile the message catalog (typecheck reads locales/<lang>/messages.ts, which is generated)
        language: system
        entry: npx --no-install lingui compile
        pass_filenames: false
        files: '\.(ts|tsx|po)$'
      - id: typecheck
        name: tsc --noEmit (the build does NOT typecheck; it sets TS_NODE_TRANSPILE_ONLY)
        language: system
        entry: npx --no-install tsc --noEmit
        pass_filenames: false
        files: '\.(ts|tsx)$'
      - id: eslint
        name: eslint (no warnings tolerated)
        language: system
        entry: npx --no-install eslint --max-warnings=0
        files: '\.(ts|tsx|js|jsx)$'
        # One process for every file. The config is type-aware (parserOptions.project), so each eslint process builds
        # the whole TypeScript program first, and pre-commit's default is one process per CPU: 32 programs at once on
        # the Studio's runner, 85 s of a gates job. Measured locally on 163 files: one process 9.5 s, ten 13.7 s,
        # thirty-two at once 37.7 s. Same files, same rules, same verdict.
        require_serial: true
        # Named explicitly, an ignored file is a warning, which fails this hook: the vendored build is checked by its hashes instead.
        exclude: ^vendor/midst-format/

      # ---- closing keywords. GitHub applies "fixes #25" in a commit message to ITS issue 25, which is not
      # ours: our commits use Gitea's numbers. Two GitHub items were closed that way (midst-infra #14). ----
      - id: no-closing-keyword-in-commit-message
        name: no closing keyword in a commit message (write Refs #N; the keyword goes in the Gitea PR body)
        language: system
        entry: python3 tools/closing_refs.py --message-file
        stages: [commit-msg]
      - id: midst-infra-copies
        name: tools/closing_refs.py, tools/issue_flow.py and tools/refuse_force_push.py are copies from midst-infra (change them there first, then here with the checksums)
        language: system
        entry: shasum -a 256 -c tools/midst-infra-copies.sha256
        pass_filenames: false
        files: '^tools/(closing_refs\.py|issue_flow\.py|refuse_force_push\.py|midst-infra-copies\.sha256)$'

      # ---- a pushed branch is never rewritten. The servers refuse it (Gitea and GitHub); this says so before
      # anything is sent, and what to do instead. A copy from midst-infra, tested there. ----
      - id: refuse-force-push
        name: no rewriting a pushed branch (merge the base in instead of rebasing)
        language: system
        entry: python3 tools/refuse_force_push.py
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: pre-push-hook-installed
        name: this clone has the pre-push hook (npm ci or pre-commit install adds it)
        language: system
        entry: python3 tools/refuse_force_push.py --installed
        always_run: true
        pass_filenames: false
