version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      # One reviewable PR per group rather than thirty separate ones.
      all-dev:
        dependency-type: development
        update-types: [minor, patch]
      all-prod:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # electron-debug 4 needs Electron 30 and 5 needs Electron 44; this app is on Electron 25.
      # Its majors cannot be taken until Electron is upgraded (#42); remove this rule then.
      - dependency-name: electron-debug
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: monthly }
