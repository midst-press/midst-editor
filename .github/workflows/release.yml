# Promotes a tested package run to a release. Nothing is rebuilt: the installers published are the
# run's own artifacts, checked byte-for-byte against the SHA-256 each build recorded.
#
# Actions -> release -> Run workflow, with the number of the package run that was tested (the
# number in that run's URL), or blank for the latest successful package run on main. Blank is refused
# when another package run on main at the same version still has artifacts: only a person knows which
# was tested. The chosen run's number, commit, version and build time head the job summary.
# It refuses, before tagging or publishing anything, a run that:
#   - is not a successful package run started from main;
#   - lacks build-info for macOS, Windows and Linux, at one version and one commit;
#   - has a macOS installer that was not signed and notarised, or any installer whose bytes differ
#     from what its build recorded;
#   - is for a version already released (or tagged) from a different commit;
#   - has no CHANGELOG.md entry for its version (the entry becomes the release notes).
# Artifacts expire after the repository's retention period, so a run must be promoted before then.
# Once the release is published and checked to carry every installer, the artifacts of this package run
# and of every earlier one are deleted (#69): GitHub Free holds 500 MB of artifacts per organisation, and
# release assets have no limit. Newer runs are never touched; one may be a candidate under test.
#
# Where releases go: this repository by default. To publish elsewhere (a public downloads
# repository, say) set the repository variable RELEASE_REPOSITORY to owner/name and the secret
# RELEASE_TOKEN to a token that can create releases there. The v<version> tag is always made here,
# on the commit that was built. See docs/releasing.md.
name: release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The package run to release (the number in its URL). Blank means the latest successful package run on main.
        required: false
        default: ''
        type: string
permissions:
  contents: write # the tag and, by default, the release
  issues: write # the last step: the issues this release fixes go to the verifier
  actions: write # to read the package run, download its artifacts, and delete released ones
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
      RELEASE_REPO: ${{ vars.RELEASE_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: choose the package run, and say which before anything is tagged
        # RUN_ID reaches every later step through GITHUB_ENV, and only from here (#82).
        run: node tools/package_run.cjs --repo "$GITHUB_REPOSITORY" --run "$RUN_ID_INPUT" --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_ENV"
      - name: check the run is a successful package run from main
        id: run
        run: |
          [[ $RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::run_id must be the run's number, got: $RUN_ID"; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID") \
            || { echo "::error::no run $RUN_ID in $GITHUB_REPOSITORY"; exit 1; }
          field() { jq -r "$1" <<< "$run"; }
          [ "$(field .path)" = .github/workflows/package.yml ] || { echo "::error::run $RUN_ID is $(field .path), not a package run"; exit 1; }
          [ "$(field .head_branch)" = main ] || { echo "::error::run $RUN_ID was built from $(field .head_branch), not main"; exit 1; }
          [ "$(field .conclusion)" = success ] || { echo "::error::run $RUN_ID concluded '$(field .conclusion)', not success"; exit 1; }
          expired=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.expired)] | length')
          [ "$expired" = 0 ] || { echo "::error::$expired of run $RUN_ID's artifacts have expired; build a new candidate"; exit 1; }
          echo "sha=$(field .head_sha)" >> "$GITHUB_OUTPUT"
          echo "url=$(field .html_url)" >> "$GITHUB_OUTPUT"
      - name: download the run's artifacts
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir candidate
      - name: check the installers are fit to release
        id: verify
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          version=$(tools/verify_candidate.sh candidate "$SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: check the version has not been released from other code
        env:
          SHA: ${{ steps.run.outputs.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          # gh prints an API error on STDOUT, so only a successful lookup counts.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$VERSION" --jq .sha 2>/dev/null) || tagged=""
          if [ -n "$tagged" ] && [ "$tagged" != "$SHA" ]; then
            echo "::error::v$VERSION already tags $tagged, not the candidate's commit $SHA. Bump the version."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            echo "::error::$RELEASE_REPO already has a release v$VERSION"
            exit 1
          fi
      - name: write the release notes from CHANGELOG.md at that commit
        env:
          SHA: ${{ steps.run.outputs.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
          RUN_URL: ${{ steps.run.outputs.url }}
        run: |
          git fetch --quiet --depth 1 origin "$SHA"
          git show "$SHA:CHANGELOG.md" > candidate-changelog.md
          {
            tools/changelog_section.sh "$VERSION" candidate-changelog.md
            echo
            echo "---"
            echo "Built by [package run $RUN_ID]($RUN_URL) from \`$SHA\`. The macOS installer is signed and notarised; check downloads against \`SHA256SUMS\`."
          } > release-notes.md
          cat release-notes.md
      - name: tag the commit
        env:
          SHA: ${{ steps.run.outputs.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
          RUN_URL: ${{ steps.run.outputs.url }}
        run: |
          tag="v$VERSION"
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha 2>/dev/null) || tagged=""
          if [ "$tagged" = "$SHA" ]; then
            echo "$tag already tags $SHA"
            exit 0
          fi
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f object="$SHA" -f type=commit \
            -f message="Midst $VERSION, built by $RUN_URL and released by $release_url" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$obj" > /dev/null
          echo "tagged $SHA as $tag"
      - name: publish the release
        env:
          # A token for another repository, when RELEASE_REPOSITORY points elsewhere.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          here=()
          # In this repository the release hangs on the tag just checked or made. Elsewhere the tag
          # does not exist, so the release creates one on that repository's default branch.
          [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && here=(--verify-tag)
          gh release create "v$VERSION" candidate/release/* --repo "$RELEASE_REPO" \
            --title "Midst $VERSION" --notes-file release-notes.md "${here[@]}"
          url=$(gh release view "v$VERSION" --repo "$RELEASE_REPO" --json url --jq .url)
          {
            echo "### Released Midst $VERSION"
            echo "$url"
            echo
            echo '```'
            cat candidate/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: check the release carries every installer
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: node tools/prune_artifacts.cjs verify --repo "$RELEASE_REPO" --tag "v$VERSION" --dir candidate/release
      - name: delete the artifacts of this package run and every earlier one
        run: node tools/prune_artifacts.cjs prune --repo "$GITHUB_REPOSITORY" --run "$RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
      # Here and not left to issue-flow.yml: a release published with this repository's own token does
      # not start other workflows, so that one would never hear of it. Last, so that a failure here
      # leaves a complete release; it can be done again from issue-flow.yml ("Run workflow", with the tag).
      - name: hand the issues this release fixes to the verifier
        env:
          RELEASE_VIEW_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
          VERIFIER: ${{ vars.MIDST_VERIFIER }}
        run: |
          url="$(GH_TOKEN="$RELEASE_VIEW_TOKEN" gh release view "v$VERSION" --repo "$RELEASE_REPO" --json url --jq .url)"
          # Not through a pipe: the step must fail when the script does, and say what it said either way.
          out="$(mktemp)"
          rc=0
          GH_REPO="$GITHUB_REPOSITORY" TAG="v$VERSION" RELEASE_URL="$url" python3 tools/issue_flow.py released > "$out" || rc=$?
          cat "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
