# Installers, on demand. Nothing is released by a push.
name: package
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [macos, windows, both]
        default: both
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            want: macos
          - os: windows-latest
            want: windows
    runs-on: ${{ matrix.os }}
    if: ${{ inputs.platform == 'both' || inputs.platform == matrix.want }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: midst-${{ matrix.want }}-${{ github.sha }}
          path: |
            release/build/*.dmg
            release/build/*.exe
            release/build/*.zip
          if-no-files-found: error
      - name: record provenance in the summary
        shell: bash
        run: |
          echo "### ${{ matrix.want }} build" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          node -e "console.log('version:', require('./package.json').version)" >> "$GITHUB_STEP_SUMMARY"
