name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      # --ignore-scripts: postinstall runs electron-builder install-app-deps, which downloads
      # Electron binaries. The gates do not need them; the packaging job does and does not skip it.
      - run: npm ci --ignore-scripts
      - run: pip install 'pre-commit==4.6.2'
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: vendored midst-format matches its VENDOR.md hashes
        run: node tools/check-vendored-format.mjs
      # Rebuilds the tag VENDOR.md names and byte-compares it with vendor/midst-format/. Waits on a read-only
      # deploy key to the private midst-format repo on Gitea, which is not created yet (the key is not ours to
      # make). On GitHub midst-format is public, so the clone needs no key there.
      # - name: vendored midst-format equals a rebuild of its tag
      #   run: |
      #     git clone --quiet "$MIDST_FORMAT_URL" "$RUNNER_TEMP/midst-format"
      #     MIDST_FORMAT_ROOT="$RUNNER_TEMP/midst-format" node tools/check-vendored-format.mjs --rebuild
      # The jest setup file (.erb/scripts/check-build-exists.ts) refuses to run until both the
      # main and renderer bundles exist, so the suite cannot start on a clean checkout. This step
      # was never reached before: pre-commit failed first on every earlier run. Building here also
      # makes CI prove the application builds, which nothing else checked.
      - run: npm run build
      - run: npm test -- --coverage

  # The end-to-end suite on Linux: Electron launched for real, headed under Xvfb. It is the only place
  # the app runs on Linux before a release (Stuart, 14 Oct). It checks that the app works there, the
  # title bar's layout included (e2e/titlebar.spec.ts); how a real desktop draws a frameless window is
  # outside what Xvfb can show.
  e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # One replay-follow test drives plain Chromium (no Electron) to check the recorder itself.
      - run: npx playwright install --with-deps chromium
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses, and Electron
      # then fails to start. This lets the sandbox run; it does not turn it off.
      - name: allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      # pree2e puts the Linux Electron in place (tools/install-electron.cjs).
      - name: end-to-end tests, headed under Xvfb
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" npm run e2e
