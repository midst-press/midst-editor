name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      # --ignore-scripts: postinstall runs electron-builder install-app-deps, which downloads
      # Electron binaries. The gates do not need them; the packaging job does and does not skip it.
      - run: npm ci --ignore-scripts
      - run: pip install 'pre-commit==4.6.0'
      - run: pre-commit run --all-files --show-diff-on-failure
      # The jest setup file (.erb/scripts/check-build-exists.ts) refuses to run until both the
      # main and renderer bundles exist, so the suite cannot start on a clean checkout. This step
      # was never reached before: pre-commit failed first on every earlier run. Building here also
      # makes CI prove the application builds, which nothing else checked.
      - run: npm run build
      - run: npm test -- --coverage
