name: Report a problem or ask for a change
description: Something in Midst does not work, or should work differently.
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste the text of a poem here or attach a `.midst` file of someone's work: this page is public. Describe what happens in your own words, or use made-up text.
  - type: textarea
    id: what
    attributes:
      label: What happened, or what do you want?
      description: What you did, what you expected, and what you saw instead. For a request, what you would like Midst to do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      # This label is read by tools/issue_flow.py (STEPS_HEADING), which quotes the answer back when a
      # release contains the fix. Change the two together.
      label: How will we know this works?
      description: Steps someone can follow in the installed app, without knowing the code, to see that it is fixed or done. For example "Type a line, quit, open the poem again, and the line is there."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Which version of Midst, on what computer?
      description: About Midst shows the version (the Midst menu on a Mac, the Help menu on Windows and Linux). For example "0.3.0 on macOS 15, Apple Silicon".
